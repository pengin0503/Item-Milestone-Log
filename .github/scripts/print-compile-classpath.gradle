// Gradle init script for the binary-linkage audit (.github/scripts/audit-merged-jar-links.py).
// Adds a printCompileClasspath task that writes the main compile classpath (one jar per
// line) to the file given by -PcpOut=<path>. Resolving the classpath makes ModDevGradle
// create the Minecraft artifacts (build/moddev/artifacts/*-merged.jar) first.
// Configuration-cache safe: the task only captures the FileCollection and the output File.
//
//   ./gradlew --init-script .github/scripts/print-compile-classpath.gradle \
//       printCompileClasspath -PcpOut=build/compile-classpath.txt
allprojects {
    afterEvaluate { p ->
        def sourceSets = p.extensions.findByName('sourceSets')
        if (sourceSets == null || !p.hasProperty('cpOut')) {
            return
        }
        def classpath = sourceSets.getByName('main').compileClasspath
        def out = p.file(p.property('cpOut'))
        p.tasks.register('printCompileClasspath') {
            inputs.files(classpath)
            outputs.upToDateWhen { false }
            doLast {
                out.parentFile.mkdirs()
                out.text = classpath.files.join('\n') + '\n'
                println "compile classpath (${classpath.files.size()} entries) -> ${out}"
            }
        }
    }
}
