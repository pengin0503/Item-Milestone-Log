name: Publish to CurseForge and Modrinth

# Manual-only publishing (spec docs/FEATURE_SPEC_1.1.0.md §4.1, candidate P53).
# Publishing is hard to undo, so this workflow NEVER runs automatically:
# no tag-push or release triggers, only workflow_dispatch with a release tag.
#
# Required repository secrets (registered by the repository owner):
#   MODRINTH_TOKEN    - Modrinth personal access token (project A4mCJN2v)
#   CURSEFORGE_TOKEN  - CurseForge API token (project 1822783)
# Tokens are passed only via env and are never echoed.
#
# The upload set is driven by publish-manifest.json, which check-release.sh wrote
# (placeholders substituted) and the release job attached to the GitHub Release:
# one upload per manifest entry, with that entry's game_versions and loader
# ("neoforge" when the loader field is absent; "forge" for the 1.20.1 port)
# (docs/DESIGN_1.3.0.md section 6, docs/DESIGN_1.20.1.md section 8.1).
#
# No third-party actions are used at all (only the preinstalled gh/git/jq/curl),
# so there is nothing to pin by SHA.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag to publish (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Upload the release jars to CurseForge and Modrinth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      MODRINTH_PROJECT_ID: A4mCJN2v
      CURSEFORGE_PROJECT_ID: "1822783"
    steps:
      - name: Download the jars, manifest and changelog for the tag
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --pattern '*.jar' --dir dist
          gh release download "$TAG" --pattern 'publish-manifest.json' --dir dist
          ls -l dist
          version="${TAG#v}"
          # Validate the jars against the manifest: as many jars as manifest
          # entries ({version} substituted), and every manifest file present.
          manifest=dist/publish-manifest.json
          if ! jq -e '.files | type == "array" and length > 0' "$manifest" > /dev/null 2>&1; then
            echo "::error::$manifest from release $TAG is missing or invalid"
            exit 1
          fi
          mapfile -t files < <(jq -r --arg v "$version" '.files[].file | gsub("\\{version\\}"; $v)' "$manifest")
          shopt -s nullglob
          jars=(dist/*.jar)
          shopt -u nullglob
          if [ "${#files[@]}" -ne "${#jars[@]}" ]; then
            echo "::error::publish-manifest.json lists ${#files[@]} files but release $TAG has ${#jars[@]} jars"
            exit 1
          fi
          for f in "${files[@]}"; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Manifest file $f is not in release $TAG"
              exit 1
            fi
          done
          if jq -e 'any(.files[].file; contains("{version}"))' "$manifest" > /dev/null; then
            echo "::error::$manifest still contains {version} placeholders; expected the concrete manifest written by check-release.sh"
            exit 1
          fi
          echo "MANIFEST=$manifest" >> "$GITHUB_ENV"
          # Extract the CHANGELOG.md section for this version (## <version> up to
          # the next ## heading) at the tagged ref.
          gh api "repos/$GH_REPO/contents/CHANGELOG.md?ref=$TAG" \
            --jq '.content' | base64 -d > CHANGELOG.full.md
          awk -v ver="$version" '
            $0 ~ "^## " ver "([ ]|$)" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.full.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::error::No CHANGELOG.md section found for version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "::error::MODRINTH_TOKEN secret is not set"
            exit 1
          fi
          changelog_json=$(jq -Rs . < changelog-section.md)
          # Idempotency (DESIGN section 6, compare version sets): the game
          # versions that already have this version_number on Modrinth are
          # fetched once; each manifest entry uploads only its game versions
          # that are still missing, and is skipped when none are, so re-running
          # after a partial failure does not create duplicates.
          existing=$(curl -sS "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: pengin0503/Item-Milestone-Log publish workflow" \
            | jq -c --arg v "$VERSION" '[.[] | select(.version_number == $v) | .game_versions[]] | unique')
          echo "Already on Modrinth for $VERSION: $existing"
          while IFS= read -r entry <&3; do
            jar="dist/$(jq -r '.file' <<< "$entry")"
            base=$(basename "$jar")
            # "neoforge" when the manifest entry has no loader field (older
            # manifests); the Forge 1.20.1 entry carries "forge".
            loader=$(jq -r '.loader // "neoforge"' <<< "$entry")
            label=$(jq -r 'if (.game_versions | length) > 1
                then "\(.game_versions[0])–\(.game_versions[-1])"
                else .game_versions[0] end' <<< "$entry")
            missing=$(jq -c --argjson have "$existing" '.game_versions - $have' <<< "$entry")
            if [ "$(jq 'length' <<< "$missing")" -eq 0 ]; then
              echo "Skipping $base: $VERSION for MC $label is already on Modrinth"
              continue
            fi
            jq -n \
              --arg name "Item Milestone Log $VERSION (MC $label)" \
              --arg version_number "$VERSION" \
              --argjson changelog "$changelog_json" \
              --arg project_id "$MODRINTH_PROJECT_ID" \
              --argjson game_versions "$missing" \
              --arg loader "$loader" \
              '{name: $name, version_number: $version_number, changelog: $changelog,
                dependencies: [], version_type: "release", loaders: [$loader],
                featured: false, project_id: $project_id,
                game_versions: $game_versions, file_parts: ["file"]}' > data.json
            jq -e . data.json > /dev/null
            echo "Uploading $base to Modrinth (game versions $missing)..."
            code=$(curl -sS -X POST "https://api.modrinth.com/v2/version" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "User-Agent: pengin0503/Item-Milestone-Log publish workflow" \
              -F "data=@data.json;type=application/json" \
              -F "file=@$jar" -o resp.json -w "%{http_code}")
            cat resp.json
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Modrinth upload failed with HTTP $code"
              exit 1
            fi
          done 3< <(jq -c '.files[]' "$MANIFEST")

      - name: Upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CURSEFORGE_TOKEN:-}" ]; then
            echo "::error::CURSEFORGE_TOKEN secret is not set"
            exit 1
          fi
          # Resolve the game version ids once: the Minecraft version entries and
          # the loader entries (NeoForge for 1.21.x/26.x, Forge for 1.20.1), via
          # the CurseForge versions API.
          curl -sS -f "https://minecraft.curseforge.com/api/game/versions" \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" > cf-versions.json
          echo "Version groups present in the CurseForge versions list:"
          jq -r 'group_by(.gameVersionTypeID)[] | "type \(.[0].gameVersionTypeID): \(length) entries, e.g. \(.[0].name), \(.[1].name // "-")"' cf-versions.json
          jq -r '.[] | select(.name == "Client" or .name == "Server" or .name == "NeoForge" or .name == "Forge") | "special: \(.id) \(.name) type \(.gameVersionTypeID)"' cf-versions.json
          neoforge_id=$(jq -r '.[] | select(.name == "NeoForge") | .id' cf-versions.json | head -1)
          forge_id=$(jq -r '.[] | select(.name == "Forge") | .id' cf-versions.json | head -1)
          env_ids=$(jq -r '.[] | select(.name == "Client" or .name == "Server") | .id' cf-versions.json | paste -sd, -)
          # A loader id is only required when the manifest has an entry for that
          # loader, so a NeoForge-only (or Forge-only) release behaves as before.
          needs_neoforge=$(jq -r 'any(.files[]; (.loader // "neoforge") == "neoforge")' "$MANIFEST")
          needs_forge=$(jq -r 'any(.files[]; (.loader // "neoforge") == "forge")' "$MANIFEST")
          if [ "$needs_neoforge" = "true" ] && [ -z "$neoforge_id" ]; then
            echo "::error::NeoForge game version id not found in the CurseForge versions list"
            exit 1
          fi
          if [ "$needs_forge" = "true" ] && [ -z "$forge_id" ]; then
            echo "::error::Forge game version id not found in the CurseForge versions list"
            exit 1
          fi
          changelog_text=$(cat changelog-section.md)
          while IFS= read -r entry <&3; do
            jar="dist/$(jq -r '.file' <<< "$entry")"
            base=$(basename "$jar")
            loader=$(jq -r '.loader // "neoforge"' <<< "$entry")
            if [ "$loader" = "forge" ]; then
              loader_id="$forge_id"
            else
              loader_id="$neoforge_id"
            fi
            label=$(jq -r 'if (.game_versions | length) > 1
                then "\(.game_versions[0])–\(.game_versions[-1])"
                else .game_versions[0] end' <<< "$entry")
            # Every game version of the entry must resolve to a CurseForge id.
            mc_ids=()
            while IFS= read -r mc; do
              mc_id=$(jq -r --arg mc "$mc" '.[] | select(.name == $mc) | .id' cf-versions.json | head -1)
              if [ -z "$mc_id" ]; then
                echo "::error::CurseForge game version id not found for Minecraft $mc"
                exit 1
              fi
              mc_ids+=("$mc_id")
            done < <(jq -r '.game_versions[]' <<< "$entry")
            mc_id_list=$(IFS=,; echo "${mc_ids[*]}")
            metadata=$(jq -n \
              --arg changelog "$changelog_text" \
              --arg displayName "Item Milestone Log $VERSION (MC $label)" \
              --argjson gameVersions "[${mc_id_list}, ${loader_id}${env_ids:+,$env_ids}]" \
              '{changelog: $changelog, changelogType: "markdown",
                displayName: $displayName, gameVersions: $gameVersions,
                releaseType: "release"}')
            echo "Uploading $base to CurseForge (MC $label)..."
            code=$(curl -sS -X POST \
              "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file" \
              -H "X-Api-Token: $CURSEFORGE_TOKEN" \
              --form-string "metadata=$metadata" \
              -F "file=@$jar" -o resp.json -w "%{http_code}")
            cat resp.json
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::CurseForge upload failed with HTTP $code"
              exit 1
            fi
          done 3< <(jq -c '.files[]' "$MANIFEST")
