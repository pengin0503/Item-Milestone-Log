name: Build

on: [push, pull_request]

jobs:
  build:
    name: Build (MC ${{ matrix.mc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.1'
            java: '21'
          - mc: '26.1.2'
            java: '25'
          - mc: '26.2'
            java: '25'
          - mc: '26.3'
            java: '25'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build with Gradle (MC ${{ matrix.mc }})
        run: gradle -p versions/${{ matrix.mc }} build

      - name: Upload built mod JAR (MC ${{ matrix.mc }})
        uses: actions/upload-artifact@v4
        with:
          name: itemmilestonelog-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/*.jar
          if-no-files-found: error
