name: Build

on:
  push:
    branches: [main]
    # A version tag (v1.0.0) also publishes a GitHub Release with the four jars.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # "min" is the NeoForge version the release jar is compiled against (and the lowest
    # version the mod declares support for); "latest" is the newest NeoForge build listed
    # in gradle.properties (neo_version_latest). Both jobs compile and unit-test against
    # their NeoForge, then run the release jar (compiled against "min") on a production
    # NeoForge server of that version.
    name: MC ${{ matrix.mc }} / NeoForge ${{ matrix.neo }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '26.1.2', '26.2', '26.3']
        neo: [min, latest]
        include:
          # bot: a vanilla-protocol client (mineflayer) joins the server. mineflayer
          # supports 1.21.1 and 26.1.x, not 26.2/26.3 yet; those get RCON checks only.
          - mc: '1.21.1'
            java: '21'
            bot: true
          - mc: '26.1.2'
            java: '25'
            bot: true
          - mc: '26.2'
            java: '25'
            bot: false
          - mc: '26.3'
            java: '25'
            bot: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/integration/package-lock.json

      - name: Select NeoForge version
        id: neo
        run: |
          props="versions/${{ matrix.mc }}/gradle.properties"
          min="$(grep -E '^neo_version=' "$props" | cut -d= -f2-)"
          version="$min"
          if [ "${{ matrix.neo }}" = "latest" ]; then
            version="$(grep -E '^neo_version_latest=' "$props" | cut -d= -f2-)"
          fi
          echo "NeoForge $version (release jar compiled against $min)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "min=$min" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: gradle -p versions/${{ matrix.mc }} build -Pneo_version=${{ steps.neo.outputs.version }} --console=plain

      - name: Build the release jar against the minimum NeoForge
        if: matrix.neo == 'latest'
        run: gradle -p versions/${{ matrix.mc }} jar -Pneo_version=${{ steps.neo.outputs.min }} --console=plain

      - name: Check the jar contents
        run: .github/scripts/verify-jar.sh ${{ matrix.mc }}

      - name: Upload release jar
        if: matrix.neo == 'min'
        uses: actions/upload-artifact@v6
        with:
          name: itemmilestonelog-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/*.jar
          if-no-files-found: error

      - name: Install integration test client
        run: npm ci --prefix .github/integration --no-audit --no-fund

      - name: Run the release jar on a NeoForge dedicated server
        run: .github/scripts/run-server-tests.sh ${{ matrix.mc }} ${{ steps.neo.outputs.version }} ${{ matrix.bot }}

      - name: Upload test reports and server logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs-${{ matrix.mc }}-${{ matrix.neo }}
          path: |
            build/server-logs/
            build/server/*/logs/
            build/server/*/config/
            versions/${{ matrix.mc }}/build/reports/tests/
          if-no-files-found: ignore

  migration:
    # A 1.21.1 world, with records made by the 1.21.1 jar, opened by the 26.1.2 jar
    # on a 26.1.2 server: the records must come over (issue #13). mineflayer joins
    # both servers; it does not support 26.2/26.3, which share the 26.1.2 code.
    name: 1.21.1 world opened on 26.1.2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 21 and 25
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/integration/package-lock.json

      - name: Download the 1.21.1 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-1.21.1
          path: versions/1.21.1/build/libs

      - name: Download the 26.1.2 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.1.2
          path: versions/26.1.2/build/libs

      - name: Install integration test client
        run: npm ci --prefix .github/integration --no-audit --no-fund

      - name: Open a 1.21.1 world on a 26.1.2 server
        run: |
          latest() { grep -E '^neo_version_latest=' "versions/$1/gradle.properties" | cut -d= -f2-; }
          .github/scripts/run-migration-test.sh "$(latest 1.21.1)" "$(latest 26.1.2)"

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs-migration
          path: |
            build/server-logs/
            build/server/*/logs/
          if-no-files-found: ignore

  release-check:
    # Runs on every build, so a broken release is found before the tag is pushed.
    name: Check the release files
    needs: [build, migration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download the release jars
        uses: actions/download-artifact@v7
        with:
          pattern: itemmilestonelog-*
          merge-multiple: true
          path: dist

      - name: Check the jars and write the release notes
        run: .github/scripts/check-release.sh dist "${{ github.ref_type == 'tag' && github.ref_name || '' }}" build/release-notes.md

  release:
    name: Publish the GitHub Release
    needs: release-check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download the release jars
        uses: actions/download-artifact@v7
        with:
          pattern: itemmilestonelog-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          .github/scripts/check-release.sh dist "$TAG" build/release-notes.md
          gh release create "$TAG" dist/*.jar --verify-tag \
            --title "Item Milestone Log ${TAG#v}" --notes-file build/release-notes.md
