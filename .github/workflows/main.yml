name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # "min" is the NeoForge version the release jar is compiled against (and the lowest
    # version the mod declares support for); "latest" is the newest NeoForge build listed
    # in gradle.properties (neo_version_latest). Both jobs compile and unit-test against
    # their NeoForge, then run the release jar (compiled against "min") on a production
    # NeoForge server of that version.
    name: MC ${{ matrix.mc }} / NeoForge ${{ matrix.neo }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '26.1.2', '26.2', '26.3']
        neo: [min, latest]
        include:
          # bot: a vanilla-protocol client (mineflayer) joins the server. mineflayer
          # supports 1.21.1 and 26.1.x, not 26.2/26.3 yet; those get RCON checks only.
          - mc: '1.21.1'
            java: '21'
            bot: true
          - mc: '26.1.2'
            java: '25'
            bot: true
          - mc: '26.2'
            java: '25'
            bot: false
          - mc: '26.3'
            java: '25'
            bot: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/integration/package-lock.json

      - name: Select NeoForge version
        id: neo
        run: |
          props="versions/${{ matrix.mc }}/gradle.properties"
          min="$(grep -E '^neo_version=' "$props" | cut -d= -f2-)"
          version="$min"
          if [ "${{ matrix.neo }}" = "latest" ]; then
            version="$(grep -E '^neo_version_latest=' "$props" | cut -d= -f2-)"
          fi
          echo "NeoForge $version (release jar compiled against $min)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "min=$min" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: gradle -p versions/${{ matrix.mc }} build -Pneo_version=${{ steps.neo.outputs.version }} --console=plain

      - name: Build the release jar against the minimum NeoForge
        if: matrix.neo == 'latest'
        run: gradle -p versions/${{ matrix.mc }} jar -Pneo_version=${{ steps.neo.outputs.min }} --console=plain

      - name: Check the jar contents
        run: .github/scripts/verify-jar.sh ${{ matrix.mc }}

      - name: Upload release jar
        if: matrix.neo == 'min'
        uses: actions/upload-artifact@v5
        with:
          name: itemmilestonelog-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/*.jar
          if-no-files-found: error

      - name: Install integration test client
        run: npm ci --prefix .github/integration --no-audit --no-fund

      - name: Run the release jar on a NeoForge dedicated server
        run: .github/scripts/run-server-tests.sh ${{ matrix.mc }} ${{ steps.neo.outputs.version }} ${{ matrix.bot }}

      - name: Upload test reports and server logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-logs-${{ matrix.mc }}-${{ matrix.neo }}
          path: |
            build/server-logs/
            build/server/*/logs/
            build/server/*/config/
            versions/${{ matrix.mc }}/build/reports/tests/
          if-no-files-found: ignore
