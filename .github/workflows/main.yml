name: Build

on:
  push:
    branches: [main]
    # A version tag (v1.0.0) also publishes a GitHub Release with the four jars.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# identical-files ─────────────────────────────────┐
# build ──┬── server-test ──┬── release-check ── release (tags only)
#         ├── migration ────┤
#         └── compat-test ──┘
jobs:
  identical-files:
    # Verifies that source/test/template files expected to remain byte-identical across
    # Minecraft versions have not drifted out of sync (docs/FEATURE_SPEC_1.1.0.md §3.2 (a)).
    name: Check identical files across versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check identical files
        run: .github/scripts/check-identical-files.sh

  build:
    # Compiles and unit-tests every Minecraft version against both NeoForge versions.
    # "min" is the NeoForge version the release jar is compiled against (and the lowest
    # version the mod declares support for); "latest" is the newest NeoForge build listed
    # in gradle.properties (neo_version_latest). The "min" job uploads the release jar,
    # which server-test then runs on a production server of both NeoForge versions.
    #
    # setup-gradle keys its cache on the workflow name, this job's id and its matrix:
    # renaming either or changing the matrix makes every job miss its Gradle cache once.
    name: Build MC ${{ matrix.mc }} / NeoForge ${{ matrix.neo }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Whether this job writes its Minecraft version's NeoForm cache entry (see "Restore
      # the NeoForm cache"): the "latest" job does, on pushes to main.
      SAVES_NEOFORM_CACHE: ${{ matrix.neo == 'latest' && github.ref == 'refs/heads/main' }}
    strategy: &versions
      fail-fast: false
      matrix:
        mc: ['1.21.1', '26.1.2', '26.2', '26.3']
        neo: [min, latest]
        include:
          # bot (used by server-test): a vanilla-protocol client (mineflayer) joins the
          # server. mineflayer supports 1.21.1 and 26.1.x, not 26.2/26.3 yet; those get
          # RCON checks only.
          - mc: '1.21.1'
            java: '21'
            bot: true
          - mc: '26.1.2'
            java: '25'
            bot: true
          - mc: '26.2'
            java: '25'
            bot: false
          - mc: '26.3'
            java: '25'
            bot: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      # The builds run through the Gradle wrapper, so gradle/wrapper/gradle-wrapper.properties
      # is the one place the Gradle version is set.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Only pushes to main write the Gradle cache; pull requests and tags only read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Has a cache entry of its own (see below). setup-gradle deletes this directory
          # right after restoring its own entry and before saving it.
          gradle-home-cache-excludes: caches/neoformruntime

      # ModDevGradle runs NeoForm Runtime, which keeps Minecraft (downloaded and patched
      # with NeoForge) and the game assets in ~/.gradle/caches/neoformruntime: 0.7-1 GB per
      # Minecraft version, most of the Gradle cache. In setup-gradle's entry it would be
      # saved again on every push to main, once per job, and a job without an entry of its
      # own restores another Minecraft version's, whose content then piles up in its own.
      # Instead, each Minecraft version has one entry, keyed on the files that set the
      # versions it depends on (Minecraft, NeoForge, Parchment, ModDevGradle), so it is
      # written only when they change. Both jobs of a Minecraft version read it; the
      # "latest" job writes it, because it builds against both NeoForge versions.
      # Restored after setup-gradle, which deletes the directory (see above).
      - name: Restore the NeoForm cache
        id: neoform
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/caches/neoformruntime
          key: neoform-v1-${{ runner.os }}-${{ matrix.mc }}-${{ hashFiles(format('versions/{0}/gradle.properties', matrix.mc), format('versions/{0}/*.gradle', matrix.mc)) }}
          # On a version change: the previous entry of this Minecraft version, so that only
          # the steps for the new version run. Its other results are deleted before saving.
          restore-keys: neoform-v1-${{ runner.os }}-${{ matrix.mc }}-

      - name: Select NeoForge version
        id: neo
        run: .github/scripts/neoforge-version.sh ${{ matrix.mc }} ${{ matrix.neo }}

      # For "Delete the NeoForm results that the build did not use" below.
      - name: Mark the start of the build
        run: touch "$RUNNER_TEMP/build-start"

      - name: Build and run unit tests
        run: ./gradlew -p versions/${{ matrix.mc }} build -Pneo_version=${{ steps.neo.outputs.version }} --console=plain

      - name: Run GameTests
        run: ./gradlew -p versions/${{ matrix.mc }} runGameTestServer -Pneo_version=${{ steps.neo.outputs.version }} --console=plain

      - name: Build the release jar against the minimum NeoForge
        if: matrix.neo == 'latest'
        run: ./gradlew -p versions/${{ matrix.mc }} jar -Pneo_version=${{ steps.neo.outputs.min }} --console=plain

      - name: Check the jar contents
        run: .github/scripts/verify-jar.sh ${{ matrix.mc }}

      # Only when there is no entry for this key yet (after a version change), and only
      # after a successful build, so a failed build saves nothing.
      - name: Delete the NeoForm results that the build did not use
        if: env.SAVES_NEOFORM_CACHE == 'true' && steps.neoform.outputs.cache-hit != 'true'
        run: .github/scripts/prune-neoform-cache.sh "$RUNNER_TEMP/build-start"

      - name: Save the NeoForm cache
        if: env.SAVES_NEOFORM_CACHE == 'true' && steps.neoform.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.gradle/caches/neoformruntime
          key: ${{ steps.neoform.outputs.cache-primary-key }}

      - name: Upload release jar
        if: matrix.neo == 'min'
        uses: actions/upload-artifact@v6
        with:
          name: itemmilestonelog-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/*.jar
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports-${{ matrix.mc }}-${{ matrix.neo }}
          path: versions/${{ matrix.mc }}/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  merge-26x:
    # N251 (docs/DESIGN_1.3.0.md section 3.3): assembles the single 26.x release jar
    # from the three per-version release jars and verifies it (variant packages,
    # mods.toml ranges, and the bytecode check that common classes reference no
    # version-specific APIs). The per-version jars remain what server-test runs;
    # the merged jar gets its own server verification in a later stage.
    name: Merge 26.x single jar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download the 26.1.2 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.1.2
          path: jars/26.1.2

      - name: Download the 26.2 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.2
          path: jars/26.2

      - name: Download the 26.3 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.3
          path: jars/26.3

      - name: Merge the 26.x jars
        run: |
          mod_version="$(grep -E '^mod_version=' versions/26.1.2/gradle.properties | cut -d= -f2-)"
          tools/merge-26x-jar.sh jars/26.1.2/*.jar jars/26.2/*.jar jars/26.3/*.jar "dist/itemmilestonelog-neoforge-26.x-$mod_version.jar"

      - name: Verify the merged jar
        run: .github/scripts/verify-merged-jar.sh dist/*.jar

      - name: Upload merged jar
        uses: actions/upload-artifact@v6
        with:
          name: itemmilestonelog-26.x
          path: dist/*.jar
          if-no-files-found: error

  merged-server-test:
    # N251 (docs/DESIGN_1.3.0.md section 3.1): runs the merged single 26.x jar on
    # production servers of every 26.x version. This is the check that actually
    # proves the single jar works cross-version: the server log checks in
    # server-lib.sh fail on linkage errors (NoClassDefFoundError and friends)
    # involving the mod, and use_server picks the config file name per version,
    # so the 26.3 run also proves the LOCAL config compat dispatch.
    name: Merged jar on Server MC ${{ matrix.mc }} / NeoForge ${{ matrix.neo }}
    needs: merge-26x
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.1.2', '26.2', '26.3']
        neo: [min, latest]
        include:
          - mc: '26.1.2'
            bot: true
          - mc: '26.2'
            bot: false
          - mc: '26.3'
            bot: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/integration/package-lock.json

      - name: Select NeoForge version
        id: neo
        run: .github/scripts/neoforge-version.sh ${{ matrix.mc }} ${{ matrix.neo }}

      - name: Download the merged 26.x jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.x
          path: dist-merged

      - name: Restore the NeoForge server
        uses: actions/cache@v5
        with:
          path: build/server/${{ matrix.mc }}-${{ steps.neo.outputs.version }}/libraries
          key: neoforge-server-v1-${{ runner.os }}-${{ matrix.mc }}-${{ steps.neo.outputs.version }}

      - name: Install integration test client
        run: npm ci --prefix .github/integration --no-audit --no-fund

      - name: Run the merged jar on a NeoForge dedicated server
        run: .github/scripts/run-server-tests.sh ${{ matrix.mc }} ${{ steps.neo.outputs.version }} ${{ matrix.bot }} dist-merged/itemmilestonelog-neoforge-26.x-*.jar

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs-merged-${{ matrix.mc }}-${{ matrix.neo }}
          path: |
            build/server-logs/
            build/server/*/logs/
            build/server/*/config/
          if-no-files-found: ignore
          retention-days: 7

  server-test:
    # Runs the release jar (compiled against the minimum NeoForge, from the "min" build
    # job) on a production NeoForge dedicated server of this job's NeoForge version.
    # !cancelled(): a failed build of one version does not hold back the other versions.
    name: Server MC ${{ matrix.mc }} / NeoForge ${{ matrix.neo }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy: *versions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/integration/package-lock.json

      - name: Select NeoForge version
        id: neo
        run: .github/scripts/neoforge-version.sh ${{ matrix.mc }} ${{ matrix.neo }}

      - name: Download the release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs

      # The NeoForge installer downloads Minecraft and the libraries and patches the
      # server; install_server (server-lib.sh) skips it when libraries/ already has this
      # NeoForge version. The migration job uses the same cache entries.
      - name: Restore the NeoForge server
        uses: actions/cache@v5
        with:
          path: build/server/${{ matrix.mc }}-${{ steps.neo.outputs.version }}/libraries
          key: neoforge-server-v1-${{ runner.os }}-${{ matrix.mc }}-${{ steps.neo.outputs.version }}

      - name: Install integration test client
        run: npm ci --prefix .github/integration --no-audit --no-fund

      - name: Run the release jar on a NeoForge dedicated server
        run: .github/scripts/run-server-tests.sh ${{ matrix.mc }} ${{ steps.neo.outputs.version }} ${{ matrix.bot }}

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs-${{ matrix.mc }}-${{ matrix.neo }}
          path: |
            build/server-logs/
            build/server/*/logs/
            build/server/*/config/
          if-no-files-found: ignore
          retention-days: 7

  migration:
    # A 1.21.1 world, with records made by the 1.21.1 jar, opened by the 26.1.2 jar
    # on a 26.1.2 server: the records must come over (issue #13). mineflayer joins
    # both servers; it does not support 26.2/26.3, which share the 26.1.2 code.
    # It only needs the jars, so it runs next to server-test.
    name: 1.21.1 world opened on 26.1.2
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 21 and 25
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/integration/package-lock.json

      - name: Select NeoForge versions
        id: neo
        run: |
          latest() { grep -E '^neo_version_latest=' "versions/$1/gradle.properties" | cut -d= -f2-; }
          old="$(latest 1.21.1)"
          new="$(latest 26.1.2)"
          echo "NeoForge $old (1.21.1) and $new (26.1.2)"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Download the 1.21.1 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-1.21.1
          path: versions/1.21.1/build/libs

      - name: Download the 26.1.2 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.1.2
          path: versions/26.1.2/build/libs

      - name: Restore the NeoForge 1.21.1 server
        uses: actions/cache@v5
        with:
          path: build/server/1.21.1-${{ steps.neo.outputs.old }}/libraries
          key: neoforge-server-v1-${{ runner.os }}-1.21.1-${{ steps.neo.outputs.old }}

      - name: Restore the NeoForge 26.1.2 server
        uses: actions/cache@v5
        with:
          path: build/server/26.1.2-${{ steps.neo.outputs.new }}/libraries
          key: neoforge-server-v1-${{ runner.os }}-26.1.2-${{ steps.neo.outputs.new }}

      - name: Install integration test client
        run: npm ci --prefix .github/integration --no-audit --no-fund

      - name: Open a 1.21.1 world on a 26.1.2 server
        run: .github/scripts/run-migration-test.sh ${{ steps.neo.outputs.old }} ${{ steps.neo.outputs.new }}

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs-migration
          path: |
            build/server-logs/
            build/server/*/logs/
          if-no-files-found: ignore
          retention-days: 7

  compat-test:
    # Verifies network compatibility between the current development version and the
    # released 1.0.1 mod jar using a real Minecraft client on Xvfb (Mesa llvmpipe) and
    # a production NeoForge dedicated server (docs/FEATURE_SPEC_1.1.0.md §3.1).
    # Runs in parallel with server-test and migration, sharing the NeoForm and NeoForge
    # server caches. Starts with 1.21.1 and 26.1.2 (26.2/26.3 will follow after client
    # launch verification).
    name: Client/Server Compat MC ${{ matrix.mc }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Final 1.0.1 code commit (PR #49; no v1.0.1 tag/release exists yet).
      # Note: spec §3.1 cited 12763d2 (PR #24), which predates PR #27 (quantity targets)
      # and has an older SyncMilestonesPayload wire format; 4c16aa2 is the released 1.0.1 code.
      BASELINE_1_0_1_REF: '4c16aa24429350a936f876b13a064e03ffbde012'
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.1'
            java: '21'
          - mc: '26.1.2'
            java: '25'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout 1.0.1 baseline commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BASELINE_1_0_1_REF }}
          path: build/baseline-1.0.1

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          gradle-home-cache-excludes: caches/neoformruntime

      - name: Restore the NeoForm cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/caches/neoformruntime
          key: neoform-v1-${{ runner.os }}-${{ matrix.mc }}-${{ hashFiles(format('versions/{0}/gradle.properties', matrix.mc), format('versions/{0}/*.gradle', matrix.mc)) }}
          restore-keys: neoform-v1-${{ runner.os }}-${{ matrix.mc }}-

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/integration/package-lock.json

      - name: Select NeoForge version
        id: neo
        run: .github/scripts/neoforge-version.sh ${{ matrix.mc }} min

      - name: Download the development release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs

      - name: Restore the NeoForge server
        uses: actions/cache@v5
        with:
          path: build/server/${{ matrix.mc }}-${{ steps.neo.outputs.version }}/libraries
          key: neoforge-server-v1-${{ runner.os }}-${{ matrix.mc }}-${{ steps.neo.outputs.version }}

      - name: Install Xvfb, xdotool and software OpenGL packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool libgl1-mesa-dri libglx-mesa0 libgl1 libglu1-mesa libopenal1

      - name: Install integration test client (for RCON /stop)
        run: npm ci --prefix .github/integration --no-audit --no-fund

      - name: Create development client launch script
        run: ./gradlew -p versions/${{ matrix.mc }} createClientLaunchScript -Pneo_version=${{ steps.neo.outputs.version }} --console=plain

      - name: Build 1.0.1 jar and client launch script
        run: ./build/baseline-1.0.1/gradlew -p build/baseline-1.0.1/versions/${{ matrix.mc }} jar createClientLaunchScript -Pneo_version=${{ steps.neo.outputs.version }} --console=plain

      - name: Run client/server version compatibility scenarios
        run: .github/scripts/run-compat-test.sh ${{ matrix.mc }} ${{ steps.neo.outputs.version }} build/baseline-1.0.1

      - name: Upload compatibility test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compat-logs-${{ matrix.mc }}
          path: |
            build/compat-logs/
            build/server/*/logs/
            versions/${{ matrix.mc }}/run/logs/
            build/baseline-1.0.1/versions/${{ matrix.mc }}/run/logs/
          if-no-files-found: ignore
          retention-days: 7

  release-check:
    # Runs on every build, so a broken release is found before the tag is pushed.
    name: Check the release files
    needs: [identical-files, build, merge-26x, merged-server-test, server-test, migration, compat-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Explicit artifact names, not the itemmilestonelog-* pattern: the
      # merge-26x job's merged jar must not land in dist until the release
      # composition is reworked for 1.3.0 (docs/DESIGN_1.3.0.md section 6).
      - name: Download the 1.21.1 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-1.21.1
          path: dist

      - name: Download the 26.1.2 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.1.2
          path: dist

      - name: Download the 26.2 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.2
          path: dist

      - name: Download the 26.3 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.3
          path: dist

      - name: Check the jars and write the release notes
        run: .github/scripts/check-release.sh dist "${{ github.ref_type == 'tag' && github.ref_name || '' }}" build/release-notes.md

  release:
    name: Publish the GitHub Release
    needs: release-check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Explicit artifact names, not the itemmilestonelog-* pattern: the
      # merge-26x job's merged jar must not land in dist until the release
      # composition is reworked for 1.3.0 (docs/DESIGN_1.3.0.md section 6).
      - name: Download the 1.21.1 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-1.21.1
          path: dist

      - name: Download the 26.1.2 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.1.2
          path: dist

      - name: Download the 26.2 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.2
          path: dist

      - name: Download the 26.3 release jar
        uses: actions/download-artifact@v7
        with:
          name: itemmilestonelog-26.3
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          .github/scripts/check-release.sh dist "$TAG" build/release-notes.md
          gh release create "$TAG" dist/*.jar --verify-tag \
            --title "Item Milestone Log ${TAG#v}" --notes-file build/release-notes.md
