license="${mod_license}"
issueTrackerURL="https://github.com/pengin0503/Item-Milestone-Log/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
updateJSONURL="https://raw.githubusercontent.com/pengin0503/Item-Milestone-Log/main/docs/updates.json"
displayTest="IGNORE_ALL_VERSION"
displayURL="https://github.com/pengin0503/Item-Milestone-Log"
# NeoForge 26.2+ reads bannerFile / iconFile (logo.png is a square 512x512 pixel-art
# image, so it is also the mod-list icon). logoFile stays for NeoForge 26.1.2, which only
# reads logoFile; the merged 26.x jar ships the 26.1.2 project's mods.toml.
bannerFile="logo.png"
iconFile="logo.png"
iconBlur=false
logoFile="logo.png"
logoBlur=false
authors="pengin0503"
description='''
Records the cumulative playtime (the vanilla Time Played statistic) at which
you first obtain each of your own target items. Set targets per player with
/milestonelog commands or the in-game GUI, get a chat notification the moment a
goal item first enters your inventory, and look back at exactly how many hours
each milestone took. Optional client installation: vanilla clients can join.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
